name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Static checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r matrix_bridge/requirements.txt
          pip install pyyaml ruff

      - name: Lint
        run: ruff check matrix_bridge/app custom_components dev

      - name: Compile
        run: python -m compileall -q matrix_bridge/app custom_components dev

      - name: Configuration and contract consistency
        run: python dev/validate.py

      - name: Media unit tests
        run: PYTHONPATH=matrix_bridge python dev/test_media.py

      - name: API smoke test
        run: PYTHONPATH=matrix_bridge python dev/smoke.py

      - name: Integration discovery and translation tests
        run: |
          pip install "homeassistant>=2025.3"   # the floor hacs.json declares
          PYTHONPATH=. python dev/test_integration.py
          PYTHONPATH=. python dev/test_notify.py

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  addon-lint:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./matrix_bridge
