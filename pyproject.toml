[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
]
ignore = [
    "B008",  # function call in default argument (voluptuous schemas)
]

[tool.ruff.lint.per-file-ignores]
# The dev scripts import after adjusting sys.path, which E402 flags.
"dev/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "custom_components"]
